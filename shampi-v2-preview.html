<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAMPI OS</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:#000; overflow:hidden; font-family:'Segoe UI', Arial, sans-serif; position:relative;
    display:flex; gap:22px; padding:26px; }

  /* ---------- black & white light blobs (background) ---------- */
  .blob{ position:absolute; filter:blur(80px) saturate(.8); opacity:.6; }
  .blob1{ width:58vmax; height:58vmax; left:-14vmax; top:-20vmax; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fafafa 0%, #bcbcbc 38%, #828282 68%, #e6e6e6 100%); }
  .blob2{ width:52vmax; height:52vmax; right:-16vmax; bottom:-18vmax; border-radius:46% 54% 60% 40%/50% 46% 54% 50%;
    background:radial-gradient(circle at 65% 65%, #e2e2e2 0%, #a3a3a3 45%, #f2f2f2 100%); }
  .blob3{ width:30vmax; height:30vmax; left:-6vmax; bottom:-12vmax; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #ffffff 0%, #969696 60%, rgba(150,150,150,0) 100%); }

  /* ---------- glass panels ---------- */
  .glass{ position:relative; background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.22); border-radius:26px;
    box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  #homePanel{ flex:1.0; display:flex; align-items:center; justify-content:center; }
  #chatPanel{ flex:0.8; display:flex; align-items:center; justify-content:center; }
  .glass .lbl{ color:rgba(255,255,255,.88); font-size:21px; letter-spacing:2.5px; font-weight:600; }

  /* ---------- middle column: boxes 1, 2, 3 ---------- */
  #midSpace{ flex:2.8; display:flex; flex-direction:column; gap:22px; min-width:0; }
  #midTop{ flex:0 0 44%; display:flex; gap:22px; min-height:0; }
  .mbox{ flex:1; overflow:hidden; }

  /* box 2: neural panel */
  #box2{ display:flex; align-items:center; padding:18px 14px; }
  #box2 .btns{ display:flex; flex-direction:column; gap:12px; z-index:2; }
  .nbtn{ display:flex; align-items:center; gap:9px; padding:9px 16px 9px 11px; border-radius:12px;
    background:rgba(10,10,14,.55); border:1px solid rgba(255,255,255,.20);
    color:#e8e8e8; font-size:13.5px; letter-spacing:.4px; white-space:nowrap; }
  .nbtn .ic{ width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); font-size:12px; }
  #box2 svg.wires{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }

  /* box 1: brain */
  #box1{ padding:0; }
  #brainCanvas{ position:absolute; inset:0; width:100%; height:100%; }

  /* box 3: office floor plan */
  #box3{ flex:1; padding:14px; }
  #box3 svg{ width:100%; height:100%; display:block; }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="glass" id="homePanel"><div class="lbl">HOME PAGE</div></div>

  <div id="midSpace">
    <div id="midTop">
      <!-- 2: neural panel -->
      <div class="glass mbox" id="box2">
        <div class="btns">
          <div class="nbtn"><span class="ic">◉</span>Memory</div>
          <div class="nbtn"><span class="ic">✦</span>Skills</div>
          <div class="nbtn"><span class="ic">♡</span>Soul</div>
          <div class="nbtn"><span class="ic">⚙</span>Settings</div>
        </div>
        <svg class="wires" viewBox="0 0 300 200" preserveAspectRatio="none">
          <path d="M118,38 C 190,38 210,100 282,100" stroke="#ffffff" stroke-width="2" fill="none" opacity=".85"/>
          <path d="M112,84 C 180,84 215,100 282,100" stroke="#c9c9c9" stroke-width="2" fill="none" opacity=".8"/>
          <path d="M104,130 C 175,130 215,100 282,100" stroke="#9a9a9a" stroke-width="2" fill="none" opacity=".8"/>
          <path d="M122,172 C 195,172 215,100 282,100" stroke="#6f6f6f" stroke-width="2" fill="none" opacity=".75"/>
          <circle cx="284" cy="100" r="5" fill="#fff"/>
          <circle cx="284" cy="100" r="11" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
        </svg>
      </div>
      <!-- 1: brain -->
      <div class="glass mbox" id="box1">
        <canvas id="brainCanvas"></canvas>
      </div>
    </div>
    <!-- 3: office -->
    <div class="glass" id="box3">
      <svg viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet">
        <g fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.55)" stroke-width="2">
          <rect x="8" y="8" width="624" height="284" rx="6"/>
        </g>
        <g fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.4)" stroke-width="1.5">
          <rect x="8" y="8" width="200" height="130"/>
          <rect x="208" y="8" width="210" height="130"/>
          <rect x="418" y="8" width="214" height="130"/>
          <rect x="8" y="138" width="150" height="154"/>
          <rect x="482" y="138" width="150" height="154"/>
        </g>
        <g fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.35)" stroke-width="1">
          <rect x="30" y="30" width="52" height="24"/><rect x="100" y="30" width="52" height="24"/>
          <rect x="30" y="80" width="52" height="24"/><rect x="100" y="80" width="52" height="24"/>
          <rect x="240" y="30" width="52" height="24"/><rect x="310" y="30" width="52" height="24"/>
          <rect x="240" y="80" width="52" height="24"/><rect x="310" y="80" width="52" height="24"/>
          <rect x="450" y="30" width="52" height="24"/><rect x="525" y="30" width="52" height="24"/>
          <rect x="450" y="80" width="52" height="24"/><rect x="525" y="80" width="52" height="24"/>
          <rect x="34" y="180" width="44" height="22"/><rect x="92" y="180" width="44" height="22"/>
          <rect x="34" y="230" width="44" height="22"/><rect x="92" y="230" width="44" height="22"/>
          <rect x="508" y="180" width="44" height="22"/><rect x="562" y="180" width="44" height="22"/>
        </g>
        <g fill="rgba(255,255,255,.75)">
          <circle cx="56" cy="66" r="5"/><circle cx="126" cy="66" r="5"/><circle cx="266" cy="66" r="5"/>
          <circle cx="336" cy="66" r="5"/><circle cx="476" cy="66" r="5"/><circle cx="551" cy="66" r="5"/>
          <circle cx="56" cy="216" r="5"/><circle cx="530" cy="216" r="5"/>
        </g>
        <g fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.4)" stroke-width="1.5">
          <rect x="235" y="185" width="170" height="60" rx="8"/>
        </g>
        <g fill="rgba(255,255,255,.7)">
          <circle cx="270" cy="215" r="5"/><circle cx="320" cy="215" r="5"/><circle cx="370" cy="215" r="5"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="glass" id="chatPanel"><div class="lbl">CHATBOX</div></div>

<script>
/* ===== APNA WALA BRAIN — 3D particle brain, animated, har taraf rotate ===== */
(function(){
  const cv=document.getElementById('brainCanvas'), ctx=cv.getContext('2d');
  let W=0,H=0,CX=0,CY=0,R=0;
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    const DPR=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height; CX=W/2; CY=H/2; R=Math.min(W,H)*0.16;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    buildStars(); buildRings(); seedPts();
  }
  addEventListener('resize',resize);
  /* background stars */
  let stars=[];
  function buildStars(){ stars=[]; const n=Math.floor(W*H/9000);
    for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,tw:Math.random()*6.28,sp:.4+Math.random()*1.2}); }
  /* rings of nodes around the brain */
  let rings=[];
  function buildRings(){ rings=[]; const RR=Math.min(W,H), ring1=RR*0.30, ring2=RR*0.42;
    for(let i=0;i<14;i++){ const a=i/14*Math.PI*2-Math.PI/2;
      rings.push({a,r:ring1,c:'#7fd4ff',s:5,ph:Math.random()*6.28}); }
    for(let i=0;i<24;i++){ const a=i/24*Math.PI*2-Math.PI/2+0.13;
      rings.push({a,r:ring2,c:i%3?'#7fd4ff':'#eaf3ff',s:4,ph:Math.random()*6.28}); } }
  /* brain particles */
  const P_COUNT=340, FOV=900; let pts=[];
  function seedPts(){ pts=[];
    for(let i=0;i<P_COUNT;i++){ const th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1),
      rr=Math.pow(Math.random(),.45)*R;
      const bx=Math.sin(ph)*Math.cos(th)*rr*1.15, by=Math.sin(ph)*Math.sin(th)*rr*.75, bz=Math.cos(ph)*rr*.85;
      pts.push({x:bx,y:by,z:bz, r:1+Math.random()*2, ph:Math.random()*6.283, hue:195+Math.random()*25, sx:0, sy:0, ss:1}); } }
  /* rotation + drag */
  let rotX=.35, rotY=0, rotVX=0, rotVY=0, pDown=false, lastPX=0, lastPY=0;
  cv.addEventListener('pointerdown',e=>{ pDown=true; lastPX=e.clientX; lastPY=e.clientY; rotVX=rotVY=0; });
  addEventListener('pointermove',e=>{ if(!pDown) return; const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
    rotY+=dx*.006; rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*.006)); rotVY=dx*.006; rotVX=dy*.006; lastPX=e.clientX; lastPY=e.clientY; });
  addEventListener('pointerup',()=>pDown=false);
  let t=0;
  function frame(){ t+=.016;
    if(!pDown){ rotY+=.0035+rotVY; rotX+=rotVX; rotVY*=.95; rotVX*=.95; rotX=Math.max(-1.2,Math.min(1.2,rotX)); }
    ctx.clearRect(0,0,W,H);
    /* stars */
    for(const st of stars){ const tw=.4+.6*Math.abs(Math.sin(t*st.sp+st.tw));
      ctx.globalAlpha=tw*.8; ctx.fillStyle='#bcd9ff';
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    /* project brain points */
    const cx=Math.cos(rotX), sx=Math.sin(rotX), cy=Math.cos(rotY), sy=Math.sin(rotY);
    for(const p of pts){ const x1=p.x*cy+p.z*sy, z1=-p.x*sy+p.z*cy, y2=p.y*cx-z1*sx, z2=p.y*sx+z1*cx,
      s=FOV/(FOV+z2); p.sx=CX+x1*s; p.sy=CY+y2*s; p.ss=s; }
    /* core glow */
    const g=ctx.createRadialGradient(CX,CY,0,CX,CY,R*2.1);
    g.addColorStop(0,'rgba(80,160,255,.20)'); g.addColorStop(1,'rgba(80,160,255,0)');
    ctx.fillStyle=g; ctx.fillRect(CX-R*2.2,CY-R*2.2,R*4.4,R*4.4);
    /* particles */
    for(const p of pts){ const tw=.65+.35*Math.sin(t*2+p.ph);
      ctx.globalAlpha=Math.max(.12,Math.min(1,p.ss*.85))*tw;
      ctx.fillStyle='hsl('+p.hue+',95%,'+(62+18*tw)+'%)';
      ctx.shadowColor='rgba(110,190,255,.9)'; ctx.shadowBlur=7*p.ss;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,p.r*p.ss,0,7); ctx.fill(); }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    /* rings */
    const ringRot=t*.05;
    for(const rn of rings){ const a=rn.a+ringRot,
      x=CX+Math.cos(a)*rn.r, y=CY+Math.sin(a)*rn.r, tw=.6+.4*Math.sin(t*2+rn.ph);
      ctx.strokeStyle=rn.c+'44'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(x,y); ctx.stroke();
      ctx.fillStyle=rn.c; ctx.globalAlpha=.5+.5*tw;
      ctx.shadowColor=rn.c; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(x,y,rn.s,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.globalAlpha=1;
      ctx.strokeStyle=rn.c+'88'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,y,rn.s+3,0,7); ctx.stroke(); }
    requestAnimationFrame(frame);
  }
  resize(); frame();
})();
</script>
</body>
</html>
